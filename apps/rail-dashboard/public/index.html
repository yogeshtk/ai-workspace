<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Next Train</title>
  <meta name="description" content="Your next five trains to work or home.">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="clock">
      <span id="now-time" class="clock-time">--:--</span>
      <span id="now-date" class="clock-date"></span>
    </div>
    <span id="mode-badge" class="badge badge-muted" hidden></span>
    <button id="settings-btn" class="icon-btn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.3 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7.4 7.4 0 0 0 1.7 1l.3 2.7h4l.3-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
  </header>

  <nav class="dir" aria-label="Direction">
    <button id="go-work" class="dir-btn" type="button" aria-pressed="false">
      <span class="dir-label">GO TO WORK</span>
      <span class="dir-route" id="work-route">Home → Work</span>
    </button>
    <button id="go-home" class="dir-btn" type="button" aria-pressed="false">
      <span class="dir-label">GO HOME</span>
      <span class="dir-route" id="home-route">Work → Home</span>
    </button>
  </nav>

  <section class="when" aria-label="Date and time">
    <div class="chips" id="date-chips" role="group" aria-label="Date"></div>
    <div class="when-row" id="when-row" hidden>
      <label class="field-inline">Date <input id="date-input" type="date"></label>
      <label class="field-inline">Leave after <input id="time-input" type="time" step="300"></label>
      <button id="back-live" class="chip chip-live" type="button">● Back to now</button>
    </div>
  </section>

  <div id="banner" class="banner" role="status" hidden></div>

  <div class="results-head">
    <div class="chips chips-small" id="route-filter" role="group" aria-label="Route filter">
      <button class="chip chip-small" data-filter="all" aria-pressed="true" type="button">All</button>
      <button class="chip chip-small" data-filter="direct" aria-pressed="false" type="button">Direct</button>
      <button class="chip chip-small" data-filter="change" aria-pressed="false" type="button" id="filter-via">Via change</button>
    </div>
    <button id="refresh-btn" class="icon-btn" type="button" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M17.6 6.4A8 8 0 1 0 19.7 14h-2.1a6 6 0 1 1-1.4-6.2L13 11h7V4z"/></svg>
    </button>
  </div>

  <main id="results" aria-live="polite" aria-busy="true">
    <div class="card skeleton"></div>
    <div class="card skeleton"></div>
    <div class="card skeleton"></div>
  </main>

  <footer class="foot">
    <button id="more-btn" class="btn-secondary" type="button" hidden>Show more options</button>
    <p id="freshness" class="freshness"></p>
    <details class="sources">
      <summary>Data sources &amp; limitations</summary>
      <div id="sources-detail"></div>
    </details>
  </footer>

  <dialog id="settings" class="sheet" aria-labelledby="settings-title">
    <form id="settings-form" method="dialog">
      <div class="sheet-head">
        <h2 id="settings-title">Your commute</h2>
        <button class="icon-btn" value="cancel" formnovalidate aria-label="Close">✕</button>
      </div>
      <p id="settings-intro" class="hint" hidden>Set your stations once — they're saved on this device.</p>

      <fieldset>
        <legend>Stations</legend>
        <div class="station-field" data-key="home">
          <label for="st-home">Home (A)</label>
          <input id="st-home" autocomplete="off" placeholder="Search station or code" required>
          <ul class="suggest" role="listbox"></ul>
        </div>
        <div class="station-field" data-key="work">
          <label for="st-work">Work (B)</label>
          <input id="st-work" autocomplete="off" placeholder="Search station or code" required>
          <ul class="suggest" role="listbox"></ul>
        </div>
        <div class="station-field" data-key="transfer">
          <label for="st-transfer">Change at (C) <span class="hint">optional</span></label>
          <input id="st-transfer" autocomplete="off" placeholder="Search station or code">
          <ul class="suggest" role="listbox"></ul>
        </div>
      </fieldset>

      <fieldset>
        <legend>Commute times</legend>
        <div class="grid2">
          <label>Morning from <input type="time" name="morningStart"></label>
          <label>Morning to <input type="time" name="morningEnd"></label>
          <label>Evening from <input type="time" name="eveningStart"></label>
          <label>Evening to <input type="time" name="eveningEnd"></label>
          <label>Earliest departure <input type="time" name="earliestDeparture"></label>
          <label>Latest departure <input type="time" name="latestDeparture"></label>
          <label>Arrive at work by <input type="time" name="arriveWorkBy"></label>
          <label>Default direction
            <select name="defaultDirection">
              <option value="auto">Automatic (by time)</option>
              <option value="work">Go to work</option>
              <option value="home">Go home</option>
            </select>
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Connections</legend>
        <div class="grid2">
          <label>Min. change time (min) <input type="number" name="minTransferMinutes" min="0" max="60" inputmode="numeric"></label>
          <label>Extra walking time (min) <input type="number" name="walkingMinutes" min="0" max="30" inputmode="numeric"></label>
          <label>Max. changes
            <select name="maxChanges"><option value="1">1 (direct + via C)</option><option value="0">0 (direct only)</option></select>
          </label>
          <label class="check"><input type="checkbox" name="preferDirect"> Prefer direct trains</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Updates</legend>
        <div class="grid2">
          <label>Refresh every
            <select name="refreshSeconds"><option value="30">30 s</option><option value="60">1 min</option><option value="120">2 min</option><option value="300">5 min</option></select>
          </label>
          <label>Search window
            <select name="windowMinutes"><option value="60">1 hour</option><option value="120">2 hours</option><option value="180">3 hours</option><option value="240">4 hours</option></select>
          </label>
        </div>
      </fieldset>

      <section class="status-box" id="status-box"></section>

      <div class="sheet-actions">
        <button class="btn-primary" value="save" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <noscript><p class="banner">This dashboard needs JavaScript.</p></noscript>
  <script type="module" src="/app.js"></script>
</body>
</html>
